<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LeadSync CRM India - Lead Management in ₹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <style>
      /* Prevent Flash of Unstyled Text (FOUT) for Material Symbols */
      html:not(.material-symbols-loaded) .material-symbols-outlined {
        color: transparent !important;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.dataset.theme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.dataset.theme = 'light';
        }

        // Font-loading helper to completely eliminate icon letters flashing (FOUT)
        if ('fonts' in document) {
          document.fonts.load('24px "Material Symbols Outlined"').then(function() {
            document.documentElement.classList.add('material-symbols-loaded');
          }).catch(function() {
            document.documentElement.classList.add('material-symbols-loaded');
          });
          // Low latency safeguard fallback: icons will show in max 400ms regardless of connection
          setTimeout(function() {
            document.documentElement.classList.add('material-symbols-loaded');
          }, 400);
        } else {
          document.documentElement.classList.add('material-symbols-loaded');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
